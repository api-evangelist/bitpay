apis:
- name: BitPay Bills API
  description: >-
    Manage payment requests sent to specific buyers with fixed-price line items typically denominated
    in fiat currency. Supports email billing and recurring payment scheduling via subscriptions.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.bitpay.com/docs
  baseURL: https://bitpay.com
  tags:
  - Bills
  - Billing
  - Invoices
  properties:
  - type: Documentation
    url: https://developer.bitpay.com/docs
  contact:
  - FN: BitPay Support
    url: https://support.bitpay.com/hc/en-us
    email: ''
- name: BitPay Payouts API
  description: >-
    Submit cryptocurrency withdrawal payments to active BitPay recipients for customer payouts, marketplace
    disbursements, affiliate networks, and payroll processing.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.bitpay.com/docs
  baseURL: https://bitpay.com
  tags:
  - Payouts
  - Cryptocurrency
  - Disbursements
  properties:
  - type: Documentation
    url: https://developer.bitpay.com/docs
  contact:
  - FN: BitPay Support
    url: https://support.bitpay.com/hc/en-us
    email: ''
- name: BitPay Refunds API
  description: >-
    Process full or partial refunds associated with invoices. Supports automatic handling of underpaid
    and overpaid amounts with cryptocurrency refund workflows.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.bitpay.com/docs
  baseURL: https://bitpay.com
  tags:
  - Refunds
  - Payments
  properties:
  - type: Documentation
    url: https://developer.bitpay.com/docs
  contact:
  - FN: BitPay Support
    url: https://support.bitpay.com/hc/en-us
    email: ''
- name: BitPay Settlements API
  description: >-
    Access transfer reports documenting payment profits settled from BitPay to merchant bank accounts
    and cryptocurrency wallets. Supports USD, EUR, GBP, CAD, AUD, NZD, MXN, and major cryptocurrencies.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.bitpay.com/docs
  baseURL: https://bitpay.com
  tags:
  - Settlements
  - Finance
  - Reporting
  properties:
  - type: Documentation
    url: https://developer.bitpay.com/docs
  contact:
  - FN: BitPay Support
    url: https://support.bitpay.com/hc/en-us
    email: ''
- name: BitPay Rates API
  description: >-
    Retrieve exchange rate data representing fiat currency equivalents per cryptocurrency unit. Supports
    BTC, ETH, BCH, XRP, DOGE, and stablecoins against major fiat currencies.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.bitpay.com/docs
  baseURL: https://bitpay.com
  tags:
  - Rates
  - Exchange
  - Cryptocurrency
  properties:
  - type: Documentation
    url: https://developer.bitpay.com/docs
  contact:
  - FN: BitPay Support
    url: https://support.bitpay.com/hc/en-us
    email: ''
- name: BitPay Ledgers API
  description: >-
    Access account balance records by currency and track individual ledger entries. Provides accounting
    data for merchant financial reconciliation.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.bitpay.com/docs
